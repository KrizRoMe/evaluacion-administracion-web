name: Hallazgo general
description: "Reportar cualquier otro hallazgo (administración, monitoreo, documentación, etc.)"
title: "[GENERAL] "
labels: ["general", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: problema
    attributes:
      label: Problema encontrado
      description: "Describe brevemente el hallazgo."
      placeholder: "Ej. El footer no indica fecha de mantenimiento ni procedimiento ante caída."
    validations:
      required: true

  - type: input
    id: ubicacion
    attributes:
      label: "Ubicación y reproducción"
      description: "¿En qué archivo/elemento se encuentra? ¿Cómo comprobarlo?"
      placeholder: |
        Pasos:
        1. Abrir el sitio público.
        2. Scroll hasta el footer.
        3. Leer el texto del copyright.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: "Donde quiera que esté: código, configuración, documentación, captura, etc."
    validations:
      required: true

  - type: dropdown
    id: pilar
    attributes:
      label: "Pilar de administración"
      options:
        - "VIVO (disponibilidad)"
        - "RÁPIDO (rendimiento)"
        - SEGURO
    validations:
      required: true

  - type: checkboxes
    id: conceptos
    attributes:
      label: "Conceptos del curso relacionados"
      description: "Marca todos los que apliquen."
      options:
        - label: "Monitoreo (activo/pasivo)"
        - label: "Uptime / disponibilidad"
        - label: "Backup 3-2-1"
        - label: "SLI / SLO / SLA"
        - label: "Runbook para incidentes"
        - label: "Documentación del sitio"
        - label: "Procedimiento ante caída"
        - label: "Otro (especificar abajo)"

  - type: dropdown
    id: mantenimiento
    attributes:
      label: "Tipo de mantenimiento"
      options:
        - Preventivo
        - Correctivo
        - Adaptativo
        - Perfectivo
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Impacto
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Baja
        - Media
        - Alta
    validations:
      required: true

  - type: input
    id: justificacion
    attributes:
      label: "Justificación de la severidad"
    validations:
      required: true

  - type: textarea
    id: solucion
    attributes:
      label: "Solución propuesta (NO es necesario aplicarla en código)"
    validations:
      required: true