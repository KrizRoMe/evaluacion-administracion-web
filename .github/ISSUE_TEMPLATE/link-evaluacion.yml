name: Link de evaluación
description: "Publica aquí el link de tu repositorio y el link público de tu GitHub Pages."
title: "[LINK] "
labels: ["entrega-link", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: nombre
    attributes:
      label: Nombre completo
      description: "Tu nombre y apellido."
      placeholder: "Ej. Juan Pérez García"
    validations:
      required: true

  - type: input
    id: codigo
    attributes:
      label: Código del estudiante
      description: "Tu código institucional / matrícula."
      placeholder: "Ej. 2021456789"
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Link de tu repositorio
      description: "URL pública de tu repositorio (debe comenzar con https://github.com/)"
      placeholder: "https://github.com/TU-USUARIO/evaluacion-administracion-web-TU-NOMBRE"
    validations:
      required: true

  - type: input
    id: publico
    attributes:
      label: Link público de tu sitio
      description: "URL pública de tu GitHub Pages. Verifica que la URL funcione antes de enviarla."
      placeholder: "https://TU-USUARIO.github.io/evaluacion-administracion-web-TU-NOMBRE/"
    validations:
      required: true