name: Hallazgo de mantenimiento
description: Reportar un problema relacionado con dependencias, npm, package.json o mantenimiento
title: "[MAINTENANCE] "
labels: ["maintenance", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: problema
    attributes:
      label: Problema encontrado
      description: Describe brevemente el hallazgo de mantenimiento que identificaste.
      placeholder: Ej. El package.json incluye dependencias con versiones muy antiguas.
    validations:
      required: true

  - type: input
    id: ubicacion
    attributes:
      label: Ubicación y reproducción
      description: ¿En qué archivo o sección se encuentra? ¿Cómo comprobarlo?
      placeholder: |
        Pasos:
        1. Abrir el archivo package.json.
        2. Revisar la sección dependencies.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: package.json, npm audit, código, etc. Pega el fragmento relevante.
      placeholder: |
        Sección: dependencies
        Detalle: jquery 2.1.4 (versión de 2014 con vulnerabilidades conocidas)
    validations:
      required: true

  - type: dropdown
    id: pilar
    attributes:
      label: Pilar de administración
      description: Selecciona el pilar con el que se relaciona este hallazgo.
      options:
        - VIVO (disponibilidad)
        - RÁPIDO (rendimiento)
        - SEGURO
    validations:
      required: true

  - type: checkboxes
    id: conceptos
    attributes:
      label: Conceptos del curso relacionados
      description: Marca todos los conceptos que apliquen.
      options:
        - label: Mantenimiento preventivo
        - label: Mantenimiento correctivo
        - label: Mantenimiento adaptativo
        - label: Mantenimiento perfectivo
        - label: Dependencias / npm / package.json
        - label: Versionado semántico
        - label: Parches de seguridad
        - label: Backups
        - label: Monitoreo / runbooks
        - label: Otro (especificar abajo)

  - type: dropdown
    id: mantenimiento_tipo
    attributes:
      label: Tipo de mantenimiento principal
      options:
        - Preventivo
        - Correctivo
        - Adaptativo
        - Perfectivo
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Impacto
      description: ¿A quién afecta? ¿Qué consecuencia tiene?
      placeholder: Ej. El sitio queda expuesto a vulnerabilidades conocidas que ya tienen parche.
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Baja
        - Media
        - Alta
    validations:
      required: true

  - type: input
    id: justificacion
    attributes:
      label: Justificación de la severidad
    validations:
      required: true

  - type: textarea
    id: solucion
    attributes:
      label: Solución propuesta (NO es necesario aplicarla en código)
      description: Describe en texto qué debería hacerse.
      placeholder: |
        - Actualizar jquery a la versión 3.7.x.
        - Eliminar dependencias no usadas (left-pad).
        - Documentar la política de actualización.
    validations:
      required: true