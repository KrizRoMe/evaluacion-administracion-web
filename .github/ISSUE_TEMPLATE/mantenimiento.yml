name: Hallazgo de mantenimiento
description: "Reportar un problema relacionado con dependencias, npm, package.json, mantenimiento o seguridad."
title: "MAINTENANCE: "
labels: ["maintenance", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: problema
    attributes:
      label: Problema
      description: "¿Qué encontraste? (sé específico y breve)"
      placeholder: "Dependencia jquery en versión 2.1.4 (2014) con vulnerabilidades conocidas."
    validations:
      required: true

  - type: input
    id: evidencia
    attributes:
      label: Evidencia (MEDIR)
      description: "package.json, npm audit, código, headers HTTP, etc."
      placeholder: "package.json línea 18: jquery 2.1.4. npm audit → 3 vulnerabilidades críticas."
    validations:
      required: true

  - type: input
    id: impacto
    attributes:
      label: Impacto
      description: "¿A quién afecta? ¿Qué consecuencia tiene?"
      placeholder: "Sitio expuesto a vulnerabilidades conocidas que ya tienen parche disponible."
    validations:
      required: true

  - type: input
    id: solucion
    attributes:
      label: Solución propuesta (PROPONER + MEJORAR)
      description: "Describe en texto qué debería hacerse."
      placeholder: "Actualizar jquery a 3.7.x. Eliminar dependencias no usadas (left-pad). Documentar política de actualización."
    validations:
      required: true

  - type: dropdown
    id: pilar
    attributes:
      label: Pilar de administración
      options:
        - "VIVO (disponibilidad)"
        - "RÁPIDO (rendimiento)"
        - SEGURO
    validations:
      required: true

  - type: checkboxes
    id: conceptos
    attributes:
      label: Conceptos del curso
      description: "Marca los que apliquen."
      options:
        - label: "Mantenimiento preventivo"
        - label: "Mantenimiento correctivo"
        - label: "Mantenimiento adaptativo"
        - label: "Mantenimiento perfectivo"
        - label: "Dependencias / npm / package.json"
        - label: "Versionado semántico"
        - label: "Parches de seguridad"
        - label: "Backups / 3-2-1"
        - label: "Monitoreo / runbooks"
        - label: "Otro (especificar en solución)"

  - type: dropdown
    id: mantenimiento_tipo
    attributes:
      label: Tipo de mantenimiento principal
      options:
        - Preventivo
        - Correctivo
        - Adaptativo
        - Perfectivo
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Baja
        - Media
        - Alta
    validations:
      required: true

  - type: input
    id: justificacion
    attributes:
      label: Justificación de la severidad
    validations:
      required: true

  - type: textarea
    id: ciclo_mejora
    attributes:
      label: Ciclo de mejora (opcional)
      description: "MEDIR → IDENTIFICAR → PROPONER → MEJORAR → VOLVER A MEDIR."
      value: |
        1. MEDIR: ¿Qué métrica/herramienta confirma el problema?
        2. IDENTIFICAR: ¿Cuál es la causa raíz?
        3. PROPONER: ¿Qué solución recomiendas?
        4. MEJORAR: ¿Cómo se implementa?
        5. VOLVER A MEDIR: ¿Cómo verificas que mejoró?