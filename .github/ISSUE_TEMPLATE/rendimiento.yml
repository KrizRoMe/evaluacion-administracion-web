name: Hallazgo de rendimiento
description: "Reportar un problema relacionado con performance, Lighthouse o métricas web."
title: "PERFORMANCE: "
labels: ["performance", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: problema
    attributes:
      label: Problema
      description: "¿Qué encontraste? (sé específico y breve)"
      placeholder: "Imagen de 4 MB en el hero."
    validations:
      required: true

  - type: input
    id: evidencia
    attributes:
      label: Evidencia (MEDIR)
      description: "Herramienta usada, métrica o fragmento que demuestra el problema."
      placeholder: "Lighthouse Performance score = 45. LCP = 6.2s. Network → hero.jpg = 4 MB."
    validations:
      required: true

  - type: input
    id: impacto
    attributes:
      label: Impacto
      description: "¿A quién afecta? ¿Qué consecuencia tiene?"
      placeholder: "Mayor cantidad de datos transferidos, LCP alto, usuarios en conexiones lentas abandonan."
    validations:
      required: true

  - type: input
    id: solucion
    attributes:
      label: Solución propuesta (PROPONER + MEJORAR)
      description: "Describe en texto qué qué debería hacerse. NO es necesario aplicarla en código."
      placeholder: "Optimizar la imagen: comprimir a WebP, ancho máximo 1200px, agregar width/height explícitos."
    validations:
      required: true

  - type: dropdown
    id: pilar
    attributes:
      label: Pilar de administración
      description: "VIVO (disponibilidad) · RÁPIDO (rendimiento) · SEGURO"
      options:
        - "VIVO (disponibilidad)"
        - "RÁPIDO (rendimiento)"
        - SEGURO
    validations:
      required: true

  - type: input
    id: concepto
    attributes:
      label: Concepto del curso
      description: "Concepto específico del curso relacionado (LCP, INP, CLS, TTFB, caching, defer, lazy loading, etc.)."
      placeholder: "LCP (Largest Contentful Paint)"
    validations:
      required: true

  - type: dropdown
    id: mantenimiento
    attributes:
      label: Tipo de mantenimiento
      options:
        - Preventivo
        - Correctivo
        - Adaptativo
        - Perfectivo
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Baja
        - Media
        - Alta
    validations:
      required: true

  - type: input
    id: justificacion
    attributes:
      label: Justificación de la severidad
      description: "Por qué asignaste esa severidad."
    validations:
      required: true

  - type: textarea
    id: ciclo_mejora
    attributes:
      label: Ciclo de mejora (opcional)
      description: "Pasos sugeridos: MEDIR → IDENTIFICAR → PROPONER → MEJORAR → VOLVER A MEDIR."
      value: |
        1. MEDIR: ¿Qué métrica/herramienta confirma el problema?
        2. IDENTIFICAR: ¿Cuál es la causa raíz?
        3. PROPONER: ¿Qué solución recomiendas?
        4. MEJORAR: ¿Cómo se implementa?
        5. VOLVER A MEDIR: ¿Cómo verificas que mejoró?