name: Hallazgo de rendimiento
description: Reportar un problema relacionado con performance, Lighthouse o métricas web
title: "[PERFORMANCE] "
labels: ["performance", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: problema
    attributes:
      label: Problema encontrado
      description: Describe brevemente el hallazgo de rendimiento que identificaste.
      placeholder: Ej. La imagen del hero tarda en cargar y supera los 4 MB.
    validations:
      required: true

  - type: input
    id: ubicacion
    attributes:
      label: Ubicación y reproducción
      description: ¿En qué archivo/elemento/URL se encuentra? Proporciona pasos suficientes para reproducirlo.
      placeholder: |
        Pasos:
        1. Abrir el sitio en modo incógnito.
        2. Inspeccionar la pestaña Network.
        3. Filtrar por Img.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, métricas de Lighthouse (LCP, INP, CLS, TTFB), DevTools Network, etc.
      placeholder: |
        Herramienta usada: Lighthouse
        Métrica o resultado: LCP = 6.2s (debería ser < 2.5s)
    validations:
      required: true

  - type: dropdown
    id: pilar
    attributes:
      label: Pilar de administración
      description: Selecciona el pilar con el que se relaciona este hallazgo.
      options:
        - VIVO (disponibilidad)
        - RÁPIDO (rendimiento)
        - SEGURO
    validations:
      required: true

  - type: input
    id: concepto
    attributes:
      label: Concepto del curso relacionado
      description: Menciona el concepto específico (LCP, INP, CLS, TTFB, caching, optimización de imágenes, defer/async, etc.).
      placeholder: Ej. LCP (Largest Contentful Paint)
    validations:
      required: true

  - type: dropdown
    id: mantenimiento
    attributes:
      label: Tipo de mantenimiento
      description: Selecciona el tipo de mantenimiento asociado.
      options:
        - Preventivo
        - Correctivo
        - Adaptativo
        - Perfectivo
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Impacto
      description: ¿A quién afecta? ¿Qué consecuencia tiene para el usuario o el sitio?
      placeholder: Ej. Los usuarios en conexiones lentas abandonan la página antes de que cargue el contenido principal.
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Baja
        - Media
        - Alta
    validations:
      required: true

  - type: input
    id: justificacion
    attributes:
      label: Justificación de la severidad
      description: Explica brevemente por qué asignaste esa severidad.
      placeholder: Ej. Es Alta porque afecta al 100% de los usuarios en la primera interacción.
    validations:
      required: true

  - type: textarea
    id: solucion
    attributes:
      label: Solución propuesta (NO es necesario aplicarla en código)
      description: Describe en texto qué debería hacerse para resolver el problema.
      placeholder: |
        - Comprimir la imagen a WebP.
        - Limitar el ancho a 1200px.
        - Agregar width y height explícitos.
    validations:
      required: true