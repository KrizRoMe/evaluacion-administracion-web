name: 📤 Entrega de evaluación
description: "Registrar la URL de tu repositorio y de tu GitHub Pages para entregar la Evaluación Práctica 01."
title: "[ENTREGA] "
labels: ["entrega", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: nombre
    attributes:
      label: Nombre completo del estudiante
      description: "Tu nombre y apellido tal como aparecen en el sistema del instituto."
      placeholder: "Ej. Juan Pérez García"
    validations:
      required: true

  - type: input
    id: codigo
    attributes:
      label: Código del estudiante
      description: "Tu código institucional / matrícula."
      placeholder: "Ej. 2021456789"
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: URL de TU repositorio
      description: "Repositorio público donde subiste tu evaluación (debe comenzar con https://github.com/)"
      placeholder: "https://github.com/TU-USUARIO/evaluacion-administracion-web-TU-NOMBRE"
    validations:
      required: true

  - type: input
    id: pages
    attributes:
      label: URL de TU GitHub Pages
      description: "URL pública de tu sitio publicado. Verifica que la URL funcione antes de enviarla."
      placeholder: "https://TU-USUARIO.github.io/evaluacion-administracion-web-TU-NOMBRE/"
    validations:
      required: true

  - type: checkboxes
    id: verificacion
    attributes:
      label: "Checklist de auto-verificación"
      description: "Marca todas las casillas que confirmes. Si alguna está sin marcar, corrige antes de enviar."
      options:
        - label: "Mi repositorio es público"
        - label: "Mi GitHub Pages carga correctamente"
        - label: "Creé EXACTAMENTE 3 Issues en MI repositorio (no aquí)"
        - label: "Cada Issue usa uno de los templates (rendimiento / mantenimiento / accesibilidad / general)"
        - label: "Cada Issue tiene TODAS las secciones completas (Problema, Ubicación, Evidencia, Concepto, Impacto, Severidad, Solución)"
        - label: "Mi README está completo (VIVO, RÁPIDO, SEGURO, 3-2-1, SLI, SLO, SLA, Runbook)"
        - label: "Mi repositorio contiene los archivos: index.html, styles.css, script.js, package.json"

  - type: dropdown
    id: estado
    attributes:
      label: "¿Terminaste la evaluación?"
      options:
        - "Sí, terminé completamente"
        - "Sí, terminé pero me faltó tiempo en alguna sección"
        - "No, tuve problemas técnicos"
    validations:
      required: true

  - type: textarea
    id: comentarios
    attributes:
      label: Comentarios o problemas técnicos (opcional)
      description: "Si tuviste algún problema técnico durante la evaluación, descríbelo aquí."
      placeholder: "Ej. Tuve problemas con la autenticación de gh CLI en los primeros 10 minutos."