name: Hallazgo de accesibilidad
description: Reportar un problema de accesibilidad detectado con axe DevTools
title: "[A11Y] "
labels: ["accessibility", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: problema
    attributes:
      label: Problema encontrado
      description: Describe brevemente el hallazgo de accesibilidad.
      placeholder: Ej. La imagen principal del hero no tiene atributo alt.
    validations:
      required: true

  - type: input
    id: ubicacion
    attributes:
      label: Ubicación y reproducción
      description: ¿En qué archivo/elemento/URL se encuentra?
      placeholder: |
        Elemento: <img src="assets/hero.svg">
        Línea: index.html, sección hero
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Regla de axe DevTools violada, WCAG relacionada, elemento afectado.
      placeholder: |
        Regla axe: image-alt
        WCAG: 1.1.1 Non-text Content
        Elemento: <img src="assets/hero.svg"> (sin atributo alt)
    validations:
      required: true

  - type: dropdown
    id: pilar
    attributes:
      label: Pilar de administración
      options:
        - VIVO (disponibilidad)
        - RÁPIDO (rendimiento)
        - SEGURO
    validations:
      required: true

  - type: checkboxes
    id: wcag
    attributes:
      label: Principios WCAG afectados
      options:
        - label: Perceptible (imágenes, color, contraste)
        - label: Operable (teclado, navegación, foco)
        - label: Comprensible (lenguaje, consistencia)
        - label: Robusto (compatibilidad con tecnologías de asistencia)

  - type: input
    id: concepto
    attributes:
      label: Concepto del curso relacionado
      placeholder: Ej. Atributo alt en imágenes, contraste WCAG AA, roles ARIA, semántica HTML.
    validations:
      required: true

  - type: dropdown
    id: mantenimiento
    attributes:
      label: Tipo de mantenimiento
      options:
        - Preventivo
        - Correctivo
        - Adaptativo
        - Perfectivo
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Impacto
      description: ¿A quién afecta? (usuarios con discapacidad, SEO, etc.)
      placeholder: Ej. Usuarios con lectores de pantalla no pueden saber qué muestra la imagen del hero.
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Baja
        - Media
        - Alta
    validations:
      required: true

  - type: input
    id: justificacion
    attributes:
      label: Justificación de la severidad
    validations:
      required: true

  - type: textarea
    id: solucion
    attributes:
      label: Solución propuesta (NO es necesario aplicarla en código)
      description: Describe en texto qué debería hacerse.
      placeholder: |
        - Agregar alt="Productos ecológicos en una mesa de madera" a la imagen del hero.
        - Verificar todas las imágenes tengan alt descriptivo.
    validations:
      required: true