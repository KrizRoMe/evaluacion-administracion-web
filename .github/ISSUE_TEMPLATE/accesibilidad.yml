name: Hallazgo de accesibilidad
description: "Reportar un problema de accesibilidad detectado con axe DevTools."
title: "A11Y: "
labels: ["accessibility", "evaluacion-01"]
assignees: []
body:
  - type: input
    id: problema
    attributes:
      label: Problema
      description: "¿Qué encontraste? (sé específico y breve)"
      placeholder: "Imagen principal del hero no tiene atributo alt."
    validations:
      required: true

  - type: input
    id: evidencia
    attributes:
      label: Evidencia (MEDIR)
      description: "Regla de axe DevTools violada, WCAG relacionada, elemento afectado."
      placeholder: "axe DevTools → regla image-alt. WCAG 1.1.1. <img src=assets/hero.svg> sin alt."
    validations:
      required: true

  - type: input
    id: impacto
    attributes:
      label: Impacto
      description: "¿A quién afecta? (usuarios con discapacidad, SEO, etc.)"
      placeholder: "Usuarios con lectores decreen no pueden saber qué muestra la imagen del hero."
    validations:
      required: true

  - type: input
    id: solucion
    attributes:
      label: Solución propuesta (PROPONER + MEJORAR)
      description: "Describe en texto qué debería hacerse."
      placeholder: "Agregar alt='Productos ecológicos en una mesa de madera' a la imagen del hero. Auditar todas las imágenes del sitio."
    validations:
      required: true

  - type: dropdown
    id: pilar
    attributes:
      label: Pilar de administración
      options:
        - "VIVO (disponibilidad)"
        - "RÁPIDO (rendimiento)"
        - SEGURO
    validations:
      required: true

  - type: checkboxes
    id: wcag
    attributes:
      label: Principios WCAG afectados
      options:
        - label: "Perceptible (imágenes, color, contraste)"
        - label: "Operable (teclado, navegación, foco)"
        - label: "Comprensible (lenguaje, consistencia)"
        - label: "Robusto (compatibilidad con tecnologías de asistencia)"

  - type: input
    id: concepto
    attributes:
      label: Concepto del curso
      placeholder: "Atributo alt en imágenes, contraste WCAG AA, roles ARIA, semántica HTML."
    validations:
      required: true

  - type: dropdown
    id: mantenimiento
    attributes:
      label: Tipo de mantenimiento
      options:
        - Preventivo
        - Correctivo
        - Adaptativo
        - Perfectivo
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Baja
        - Media
        - Alta
    validations:
      required: true

  - type: input
    id: justificacion
    attributes:
      label: Justificación de la severidad
    validations:
      required: true

  - type: textarea
    id: ciclo_mejora
    attributes:
      label: Ciclo de mejora (opcional)
      description: "MEDIR → IDENTIFICAR → PROPONER → MEJORAR → VOLVER A MEDIR."
      value: |
        1. MEDIR: ¿Qué métrica/herramienta confirma el problema?
        2. IDENTIFICAR: ¿Cuál es la causa raíz?
        3. PROPONER: ¿Qué solución recomiendas?
        4. MEJORAR: ¿Cómo se implementa?
        5. VOLVER A MEDIR: ¿Cómo verificas que mejoró?